<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SHOP｜BUN BUN BURGER</title>
    <link rel="stylesheet" href="app/globals.css" />
  </head>
  <body>
    <main class="simple-page">
      <a class="back-link" href="index.html">← ホームにもどる</a>
      <p class="eyebrow">OUR SHOP / OSAKA</p>
      <h1>鉄板の音が、<br />聞こえる店。</h1>
      <section class="shop-page-lead">
        <figure>
          <img
            src="public/images/shop-exterior.webp"
            alt="大阪の街角にあるBUN BUN BURGERの外観"
          />
          <figcaption>街角の赤いドアが目印。</figcaption>
        </figure>
        <article class="simple-card red-card">
          <p class="eyebrow">OPEN 11:00—22:00</p>
          <h2>大阪市北区<br />バンバン町 8-8</h2>
          <p>
            地下鉄「バンバン駅」2番出口から徒歩5分。カウンター8席、テーブル12席。テイクアウトできます。
          </p>
          <p style="margin-top: 40px; font-size: 13px">
            ※
            ポートフォリオ制作のための架空店舗です。実在の店舗・住所ではありません。
          </p>
        </article>
      </section>
      <section class="shop-page-gallery">
        <figure>
          <img
            src="public/images/shop-interior.webp"
            alt="赤い椅子とカウンターが並ぶ店内"
          />
          <figcaption>カウンター越しに、鉄板の音。</figcaption>
        </figure>
        <figure>
          <img
            src="public/images/shop-people.webp"
            alt="バーガーを楽しむ二人とスタッフ"
          />
          <figcaption>ふらっと来て、ゆっくりどうぞ。</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
